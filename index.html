function sy(c,t){const b=$("#sy");b.className="sy np "+c;b.innerHTML='<i class="dt"></i><span>'+t+'</span>'}
async function post(action,p={}){const ac=new AbortController(),tm=setTimeout(()=>ac.abort(),30000);try{const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({pin:PIN,action,...p}),signal:ac.signal});return await r.json()}finally{clearTimeout(tm)}}
async function call(action,p){if(!ON)return false;sy("wk","Menyimpan…");try{const r=await post(action,p);if(!r.ok){if(/PIN/.test(r.error||"")){needLogin();return false}throw r.error}sy("ok","Tersimpan");return true}catch(e){sy("er","Gagal sinkron");toast("Gagal menyimpan ke server. Data aman di perangkat; coba lagi lewat Pengaturan.");setTimeout(()=>toast(""),4500);return false}}
let lastCfg="";
function syncCfg(){if(!ON||noSync||!PIN)return;const j=JSON.stringify(S.cfg);if(j==lastCfg)return;clearTimeout(ct);ct=setTimeout(async()=>{if(await call("config",{cfg:S.cfg}))lastCfg=j},700)}
async function pull(){if(!ON)return sy("er","Mode lokal");if(!PIN)return needLogin();sy("wk","Memuat…");
try{const r=await post("load");if(!r.ok){if(/PIN/.test(r.error||""))return needLogin();throw r.error}
if(!r.trx.length&&S.trx.length){if(confirm("Server masih kosong. Kirim "+S.trx.length+" transaksi dari perangkat ini ke server?"))return pushAll(true);sy("er","Server kosong");return}
noSync=true;if(r.cfg){S.cfg=normCfg(r.cfg);lastCfg=JSON.stringify(S.cfg)}S.trx=(r.trx||[]).map(nt).filter(t=>t.tgl);S.log=r.log||[];const mg=migCek();sv();noSync=false;if(mg.length)call("upsert",{trx:mg});if(!r.cfg)syncCfg();R();sy("ok","Tersinkron")}
catch(e){noSync=false;sy("er","Offline");toast("Tidak dapat terhubung ke server. Menampilkan data tersimpan di perangkat.");setTimeout(()=>toast(""),4500)}}
async function pushAll(q){if(!ON)return alert("API_URL belum diisi di index.html.");if(!q&&!confirm("Seluruh data di server akan DIGANTI dengan data di perangkat ini. Lanjutkan?"))return;const ok=await call("replace",{trx:S.trx,cfg:S.cfg});toast(ok?"Data terkirim ke server":"Gagal mengirim data ke server");setTimeout(()=>toast(""),2500)}
function needLogin(){sy("er","Perlu PIN");$("#lo").classList.add("on");setTimeout(()=>$("#pin").focus(),50)}
async function login(){const p=$("#pin").value.trim();if(!p)return;$("#le").textContent="";PIN=p;try{const r=await post("ping");if(!r.ok){PIN="";$("#le").textContent="PIN salah";return}localStorage.setItem("bos-pin",p);$("#pin").value="";$("#lo").classList.remove("on");pull()}catch(e){PIN="";$("#le").textContent="Tidak dapat terhubung. Periksa API_URL dan koneksi internet."}}
function logout(){localStorage.removeItem("bos-pin");PIN="";if(ON)needLogin()}
function tgSb(){const a=$(".app");a.classList.toggle("hs");try{localStorage.setItem("bos-sb",a.classList.contains("hs")?"1":"0")}catch(e){}}
function boot(){try{if(localStorage.getItem("bos-sb")=="1")$(".app").classList.add("hs")}catch(e){}R();ON?(PIN?pull():needLogin()):sy("er","Mode lokal")}
aplTema();migCek();boot();
</script></body></html>
