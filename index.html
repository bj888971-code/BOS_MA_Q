<script>

const BL=["Januari","Februari","Maret","April","Mei","Juni","Juli","Agustus","September","Oktober","November","Desember"],RM=["I","II","III","IV","V","VI","VII","VIII","IX","X","XI","XII"];

let S;try{S=JSON.parse(localStorage.getItem("bos-maf"))}catch(e){}if(!S||!S.cfg)S=JSON.parse(JSON.stringify(DEF));
S.log=S.log||[];const ui={tab:"dsb",tp:Math.ceil((new Date().getMonth()+1)/6),bln:0,edit:null,form:null};

const $=s=>document.querySelector(s),rp=n=>"Rp "+Math.round(n).toLocaleString("id-ID"),esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

const NU={};function nomor(){const m={},c={};[...S.trx].sort((a,b)=>a.tgl.localeCompare(b.tgl)||a.id-b.id).forEach(t=>{const k=t.tgl.slice(0,7);c[k]=(c[k]||0)+1;NU[t.id]=c[k];m[t.id]="PK.0"+c[k]+"/"+RM[mo(t)-1]+"/"+t.tgl.slice(0,4)});return m}

function R(){$("#th").value=S.cfg.tahun;$("#tp").value=ui.tp;$("#nav").innerHTML=`<div class="br"><b>BOS</b><span>MA Al Fattah</span></div>`+TABS.map(t=>`<button class="${ui.tab==t[0]?"on":""}" title="${t[1]}" onclick="ui.tab='${t[0]}';R();$('#app').scrollTop=0"><svg viewBox="0 0 24 24">${IC[t[0]]}</svg><em>${t[1]}</em></button>`).join("");$("#tt").innerHTML=`<b>${TABS.find(t=>t[0]==ui.tab)[1]}</b><small>Tahap ${ui.tp} · ${S.cfg.tahun}</small>`;$("#app").innerHTML={dsb:vDsb,trx:vTrx,lap:vLap,kui:vKui,tt:vTT,cek:vCek,set:vSet}[ui.tab]();if(ui.tab=="trx")ft()}

function ft(){let s=0;document.querySelectorAll("#its tr").forEach(r=>s+=(+r.querySelector(".j").value||0)*(+r.querySelector(".h").value||0));const e=$("#ftot");if(e)e.textContent=rp(s)}
function vTrx(){const f=ui.form||{tgl:"",bayar:"",nama:"",kode:"",pen:"",bukti:"nota",items:[{}]};const L=lst();
const used=[...new Set([...S.cfg.kodes,...S.trx.map(t=>t.kode)].filter(Boolean))];
return `<div class="card np"><h2>${ui.edit?"Ubah transaksi":"Tambah transaksi"}</h2><div class="g">

<table class="ti"><tr><td>Nama Sekolah</td><td>:</td><td>${esc(c.madrasah)}</td></tr><tr><td>Kecamatan</td><td>:</td><td>${esc(c.kec)}</td></tr><tr><td>Kabupaten</td><td>:</td><td>${esc(c.kab)}</td></tr></table>

<div class="sg"><div>Mengetahui,<br>Kepala Madrasah<i></i><b><u>${esc(c.kepala)}</u></b></div><div>${esc(c.desa)}, ${tgl(t.bayar||t.tgl)}<br>Bendahara,<i></i><b><u>${esc(c.bendahara)}</u></b></div></div></div>`};
function vTT(){const L=LT();return `<div class="card np"><div class="row"><h2 style="margin:0">Tanda Terima</h2><span style="flex:1"></span>${selBln()}<button class="o" onclick="print()" ${L.length?"":"disabled"}>Cetak A4</button><button class="b" onclick="pdf()" ${L.length?"":"disabled"}>Unduh PDF (${L.length})</button></div><p class="m">Berisi transaksi yang bukti belanjanya dipilih “tanda terima” di menu Input Transaksi (Tahap ${ui.tp} ${S.cfg.tahun}).</p></div>`+(L.map(t=>`<div class="tw">${ttH(t)}<div class="np" style="text-align:right;margin:-6px 0 14px"><button class="o" onclick="pdf(${t.id})">Unduh PDF tanda terima ini</button></div></div>`).join("")||`<div class="card m">Belum ada transaksi dengan bukti “tanda terima” pada periode ini.</div>`)}

function tg(id,on){const t=gt(id);if(!t)return;on?t.cek=1:delete t.cek;call("upsert",{trx:[t]});const m=$("#app"),y=m.scrollTop;sv();R();m.scrollTop=y}
function vCek(){const N=nomor(),C=Object.fromEntries(S.trx.filter(t=>t.cek).map(t=>[t.id,1])),A=[...S.trx].sort((a,b)=>a.tgl.localeCompare(b.tgl)||a.id-b.id).map(t=>({...t,no:N[t.id],u:NU[t.id]})),q=(ui.cq||"").toLowerCase(),f=ui.cf||"all";
const L=A.filter(t=>(f=="all"||(f=="sudah")==!!C[t.id])&&(!q||[t.nama,t.kode,t.pen,t.no,t.bukti].join(" ").toLowerCase().includes(q))),D=A.filter(t=>C[t.id]),vD=D.reduce((a,t)=>a+tot(t),0),vA=A.reduce((a,t)=>a+tot(t),0);
return `<div class="k"><div><span>Total transaksi</span><b>${A.length}</b></div><div><span>Sudah dicek</span><b>${D.length}</b></div><div><span>Belum dicek</span><b>${A.length-D.length}</b></div><div><span>Nilai dicek / total</span><b style="font-size:13px">${rp(vD)} / ${rp(vA)}</b></div></div>
<div class="card np"><div class="row"><div style="width:170px"><label>Status</label><select onchange="ui.cf=this.value;R()"><option value="all" ${f=="all"?"selected":""}>Semua</option><option value="belum" ${f=="belum"?"selected":""}>Belum dicek</option><option value="sudah" ${f=="sudah"?"selected":""}>Sudah dicek</option></select></div><div style="width:240px"><label>Cari</label><input value="${esc(ui.cq||"")}" placeholder="Nama, kode, penerima…" onchange="ui.cq=this.value;R()"></div><span style="flex:1"></span><button class="o" onclick="print()">Cetak</button></div></div>
<div class="card"><h2>Seluruh transaksi (semua tahun &amp; tahap)</h2><div class="sc"><table><thead><tr><th class="np" style="width:38px">✓</th><th>No. bukti</th><th>Tgl. Transaksi</th><th>Tgl. Pembayaran</th><th>Transaksi</th><th>Kode</th><th>Bukti</th><th class="r">Total</th></tr></thead><tbody>${L.map(t=>`<tr class="${C[t.id]?"dn":""}"><td class="ck np"><input type="checkbox" class="cb" ${C[t.id]?"checked":""} onchange="tg(${t.id},this.checked)"></td><td>${t.no}</td><td>${tgl(t.tgl)}</td><td>${tgl(t.bayar||t.tgl)}</td><td>${esc(t.nama)}${t.pen?`<div class="m">${esc(t.pen)}</div>`:""}</td><td>${esc(t.kode)}</td><td>${esc(t.bukti)}</td><td class="r">${rp(tot(t))}</td></tr>`).join("")||`<tr><td colspan="8" class="m">Tidak ada transaksi.</td></tr>`}</tbody>${L.length?`<tfoot><tr><th colspan="7">Jumlah (${L.length} transaksi)</th><th class="r">${rp(L.reduce((a,t)=>a+tot(t),0))}</th></tr></tfoot>`:""}</table></div></div>`}
async function pdf(id){const tt=ui.tab=="tt",H=tt?ttH:kwH,L=id?[gt(id)]:tt?LT():lst();if(!L.length)return;if(!window.html2pdf)return alert("Pustaka PDF belum termuat. Periksa koneksi internet lalu muat ulang.");const N=nomor(),el=document.createElement("div");el.className="pdf";el.innerHTML=L.map(t=>H({...t,no:N[t.id],u:NU[t.id]})).join(tt?'<div class="html2pdf__page-break"></div>':"");document.body.appendChild(el);toast("Menyiapkan PDF…");

/* ===== SINKRONISASI GOOGLE SHEET ===== */
const ON=!/ISI_ID_DEPLOYMENT/.test(API_URL);let PIN=localStorage.getItem("bos-pin")||"",noSync=false,ct;
function sy(c,t){const b=$("#sy");b.className="sy np "+c;b.innerHTML='<i class="dt"></i><span>'+t+'</span>'}
async function post(action,p={}){const r=await fetch(API_URL,{method:"POST",headers:{"Content-Type":"text/plain;charset=utf-8"},body:JSON.stringify({pin:PIN,action,...p})});return r.json()}
async function call(action,p){if(!ON)return;sy("wk","Menyimpan…");try{const r=await post(action,p);if(!r.ok){if(/PIN/.test(r.error||""))return needLogin();throw r.error}sy("ok","Tersimpan")}catch(e){sy("er","Gagal sinkron");toast("Gagal menyimpan ke server. Data aman di perangkat; coba lagi lewat Pengaturan.");setTimeout(()=>toast(""),4500)}}
function syncCfg(){if(!ON||noSync||!PIN)return;clearTimeout(ct);ct=setTimeout(()=>call("config",{cfg:S.cfg}),700)}
async function pull(){if(!ON)return sy("er","Mode lokal");if(!PIN)return needLogin();sy("wk","Memuat…");
try{const r=await post("load");if(!r.ok){if(/PIN/.test(r.error||""))return needLogin();throw r.error}
if(!r.trx.length&&S.trx.length&&confirm("Server masih kosong. Kirim "+S.trx.length+" transaksi dari perangkat ini ke server?"))return pushAll(true);
noSync=true;if(r.cfg)S.cfg={...DEF.cfg,...r.cfg,dana:{...DEF.cfg.dana,...(r.cfg.dana||{})}};S.trx=r.trx;S.log=r.log||[];const mg=migCek();sv();noSync=false;if(mg.length)call("upsert",{trx:mg});if(!r.cfg)syncCfg();R();sy("ok","Tersinkron")}
catch(e){noSync=false;sy("er","Offline");toast("Tidak dapat terhubung ke server. Menampilkan data tersimpan di perangkat.");setTimeout(()=>toast(""),4500)}}
async function pushAll(q){if(!ON)return alert("API_URL belum diisi di index.html.");if(!q&&!confirm("Seluruh data di server akan DIGANTI dengan data di perangkat ini. Lanjutkan?"))return;await call("replace",{trx:S.trx,cfg:S.cfg});toast("Data terkirim ke server");setTimeout(()=>toast(""),2500)}
function needLogin(){sy("er","Perlu PIN");$("#lo").classList.add("on");setTimeout(()=>$("#pin").focus(),50)}
async function login(){const p=$("#pin").value.trim();if(!p)return;$("#le").textContent="";PIN=p;try{const r=await post("ping");if(!r.ok){PIN="";$("#le").textContent="PIN salah";return}localStorage.setItem("bos-pin",p);$("#pin").value="";$("#lo").classList.remove("on");pull()}catch(e){PIN="";$("#le").textContent="Tidak dapat terhubung. Periksa API_URL dan koneksi internet."}}
function logout(){localStorage.removeItem("bos-pin");PIN="";if(ON)needLogin()}
function tgSb(){const a=$(".app");a.classList.toggle("hs");try{localStorage.setItem("bos-sb",a.classList.contains("hs")?"1":"0")}catch(e){}}
function boot(){try{if(localStorage.getItem("bos-sb")=="1")$(".app").classList.add("hs")}catch(e){}R();ON?(PIN?pull():needLogin()):sy("er","Mode lokal")}
migCek();boot();
